media:
  input: images/cars
  output: /images/cars

content:
  - name: cars
    label: Biler
    type: collection
    path: cars
    format: json

    filename: "{brand}-{model}-{year}.json"

    view:
      primary: model
      fields:
        - brand
        - model
        - year
        - price
        - sold
      sort:
        - brand
        - model
        - year
        - price

    fields:
      - name: brand
        label: Mærke
        type: string
        required: true

      - name: model
        label: Model
        type: string
        required: true

      - name: variant
        label: Variant
        type: string

      - name: year
        label: Årgang
        type: number
        required: true

      - name: price
        label: Pris
        type: number
        required: true

      - name: km
        label: Kilometer
        type: number
        required: true

      - name: fuel
        label: Brændstof
        type: select
        options:
          values:
            - Benzin
            - Diesel
            - El
            - Hybrid
            - Plug-in hybrid

      - name: gearbox
        label: Gearkasse
        type: select
        options:
          values:
            - Manuel
            - Automatisk

      - name: description
        label: Beskrivelse
        type: text

      - name: images
        label: Billeder
        type: image
        required: true
        options:
          multiple:
            max: 12
          unique: true
          extensions:
            - jpg
            - jpeg
            - png
            - webp
          rename: true

      - name: sold
        label: Solgt
        type: boolean
